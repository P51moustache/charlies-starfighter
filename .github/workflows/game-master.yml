# Game Master: send a surprise into Charlie's game from the GitHub app (Actions -> Game Master -> Run workflow).
# Built by build.mjs from tools/gm/action-workflow.mjs and the game's own event list; every deploy replaces it.
name: "Game Master"
run-name: "Game Master: ${{ inputs.surprise }}${{ inputs.dry_run && ' (practice run)' || '' }}"
on:
  workflow_dispatch:
    inputs:
      surprise:
        description: "Surprise: what happens in Charlie's game"
        type: "choice"
        required: true
        default: "(pick one)"
        options: ["(pick one)", "Dark Lord duel", "Knight duel", "Robot drop ships", "Giant walker", "Crystal rain", "Fireworks", "Bleep party", "Present", "Message from Dad", "Combo", "Build something", "Weather and sky", "Treasure hunt", "Crystal gift", "Animal parade", "Dad's challenge", "★ Party time", "★ Bedtime", "★ Robot battle", "★ Treasure time", "★ Snow day", "★ His name in gold", "★ Animal show"]
      ships:
        description: "Ships (Robot drop ships): how many fly in"
        type: "choice"
        required: true
        default: "1"
        options: ["1", "2", "3"]
      walker:
        description: "Walker (Giant walker): which kind comes"
        type: "choice"
        required: true
        default: "The planet's own"
        options: ["The planet's own", "Heavy Strider", "Crab Tank", "Frost Mammoth", "Scout Hopper", "Sand Skitter", "Sky Stilt"]
      present:
        description: "Present: which prize"
        type: "choice"
        required: true
        default: "(pick one)"
        options: ["(pick one)", "Silver paint", "Midnight paint", "Sunset paint", "Rainbow paint", "Glass blocks", "Gold blocks", "Glow blocks", "Bobble hat", "Explorer hat", "Cowboy hat", "Propeller cap", "Party hat", "Wizard hat", "Top hat", "Crown", "Trooper helmet"]
      message:
        description: "Message (Message from Dad): your words, up to 120 letters"
        type: "string"
        required: false
        default: ""
      details:
        description: "More choices: like --colour rainbow --count 15 (see node tools/gm.mjs help)"
        type: "string"
        required: false
        default: ""
      combo:
        description: "Combo steps: for a Combo, like: fireworks ; wait over ; crystalRain --count 20"
        type: "string"
        required: false
        default: ""
      dry_run:
        description: "Practice run: check it and send nothing"
        type: "boolean"
        required: false
        default: false
permissions:
  contents: "write"
  pages: "write"
concurrency:
  group: "game-master"
  cancel-in-progress: false
  queue: "max"
jobs:
  send:
    name: "Send the surprise"
    runs-on: "ubuntu-latest"
    timeout-minutes: 5
    steps:
      - name: "Get the site"
        id: "site"
        uses: "actions/checkout@v4"
        with:
          ref: "gh-pages"
          fetch-depth: 1
      - name: "Add the surprise"
        id: "send"
        env:
          GM_SURPRISE: "${{ inputs.surprise }}"
          GM_SHIPS: "${{ inputs.ships }}"
          GM_WALKER: "${{ inputs.walker }}"
          GM_PRESENT: "${{ inputs.present }}"
          GM_MESSAGE: "${{ inputs.message }}"
          GM_DETAILS: "${{ inputs.details }}"
          GM_COMBO: "${{ inputs.combo }}"
          GM_DRY_RUN: "${{ inputs.dry_run }}"
        run: "node .github/game-master/send.mjs"
      - name: "Publish it"
        id: "publish"
        if: "${{ !inputs.dry_run }}"
        shell: "bash"
        env:
          GM_SURPRISE: "${{ inputs.surprise }}"
          GM_SHIPS: "${{ inputs.ships }}"
          GM_WALKER: "${{ inputs.walker }}"
          GM_PRESENT: "${{ inputs.present }}"
          GM_MESSAGE: "${{ inputs.message }}"
          GM_DETAILS: "${{ inputs.details }}"
          GM_COMBO: "${{ inputs.combo }}"
          GM_DRY_RUN: "${{ inputs.dry_run }}"
          GM_EVENT_ID: "${{ steps.send.outputs.id }}"
          GM_SENT_AT: "${{ steps.send.outputs.at }}"
          COMMIT_MESSAGE: "Game Master: ${{ steps.send.outputs.type }}"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for try in $(seq 1 5); do
            if [ "$try" -gt 1 ]; then
              sleep $((try * 2))
              git fetch -q --depth 1 origin gh-pages && git reset -q --hard FETCH_HEAD && node .github/game-master/send.mjs || continue
            fi
            git add events.json
            if git diff --cached --quiet; then
              echo "The site already has this surprise."
              exit 0
            fi
            git commit -q -m "$COMMIT_MESSAGE"
            if git push -q origin "HEAD:gh-pages"; then
              echo "Published (try $try)."
              exit 0
            fi
            echo "The push was turned away (try $try of 5): starting again from the newest site."
          done
          echo "::error title=Game Master::Could not publish the surprise after 5 tries."
          exit 1
      - name: "Ask GitHub Pages to rebuild"
        id: "rebuild"
        if: "${{ !inputs.dry_run }}"
        shell: "bash"
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          for try in $(seq 1 3); do
            if curl -fsS -X POST -o /dev/null \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pages/builds"; then
              echo "GitHub Pages is rebuilding the site."
              exit 0
            fi
            sleep $((try * 5))
          done
          echo "::error title=Game Master::GitHub Pages didn't take the rebuild request."
          exit 1
      - name: "Say what happened"
        if: "${{ !cancelled() && steps.site.outcome == 'success' }}"
        env:
          GM_SURPRISE: "${{ inputs.surprise }}"
          GM_SHIPS: "${{ inputs.ships }}"
          GM_WALKER: "${{ inputs.walker }}"
          GM_PRESENT: "${{ inputs.present }}"
          GM_MESSAGE: "${{ inputs.message }}"
          GM_DETAILS: "${{ inputs.details }}"
          GM_COMBO: "${{ inputs.combo }}"
          GM_DRY_RUN: "${{ inputs.dry_run }}"
          GM_SENT: "${{ steps.send.outputs.summary }}"
          GM_SEND_OUTCOME: "${{ steps.send.outcome }}"
          GM_PUBLISH_OUTCOME: "${{ steps.publish.outcome }}"
          GM_REBUILD_OUTCOME: "${{ steps.rebuild.outcome }}"
        run: "node .github/game-master/send.mjs report"
